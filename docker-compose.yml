volumes:
  product_data:   # database & file milik product-service
  account_data:   # database & file milik account-service

services:
  product-service:          # PocketBase #1: koleksi products
    build: ./pocketbase
    command: ["pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations", "--automigrate=false"]
    restart: unless-stopped
    volumes:
      - product_data:/pb_data
      - ./migrations/product:/pb_migrations:ro
    ports:
      - "8091:8090"         # dashboard: http://IP_SERVER:8091/_/

  account-service:          # PocketBase #2: users + favorites
    build: ./pocketbase
    command: ["pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations", "--automigrate=false"]
    restart: unless-stopped
    volumes:
      - account_data:/pb_data
      - ./migrations/account:/pb_migrations:ro
    ports:
      - "8092:8090"         # dashboard: http://IP_SERVER:8092/_/

  gateway:                  # satu pintu masuk API
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
      - account-service

  tunnel:                   # opsional: Cloudflare Tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - gateway
    profiles: ["tunnel"]
